[package]
name = "time-stepping"
version = "0.1.0"
edition = "2024"

[dependencies]
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "field"
path = "src/bin/field.rs"

[[bin]]
name = "fluid"
path = "src/bin/fluid.rs"

[[bin]]
name = "stability-data"
path = "scripts/stability_data.rs"

[[bin]]
name = "accuracy-data"
path = "scripts/accuracy_data.rs"

[[bin]]
name = "differentiation-check"
path = "scripts/differentiation_check.rs"

[[bin]]
name = "sensitivity-data"
path = "scripts/sensitivity_data.rs"
